<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHADKA PHOTO BOOTH</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --accent: #ec4899;
        }
        body {
            background-color: #09090b;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: ui-sans-serif, system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        /* Compact Square Camera Container */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 300px; /* Slightly smaller for better mobile fit */
            margin: 0 auto;
            border-radius: 1.25rem;
            overflow: hidden;
            background: #000;
            border: 1px solid #27272a;
            aspect-ratio: 1/1;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7);
        }

        #input_video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .mirrored {
            transform: scaleX(-1);
        }

        /* Flash Animation */
        .flash-active {
            animation: flashAnim 0.6s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }
        @keyframes flashAnim {
            0% { background: white; opacity: 1; }
            100% { background: transparent; opacity: 0; }
        }

        /* Vertical Strip UI Preview */
        .strip-preview-vertical {
            background: white;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 150px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: 0 auto;
        }
        
        .strip-preview-vertical img {
            width: 100%;
            aspect-ratio: 16/10;
            object-fit: cover;
        }

        .strip-footer-text {
            color: #000;
            font-size: 9px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 1.5px;
            padding-top: 2px;
            text-transform: uppercase;
        }

        .countdown-text {
            text-shadow: 0 0 30px rgba(0,0,0,0.8);
            font-variant-numeric: tabular-nums;
        }

        /* Rotate Button - Always clickable unless actually capturing */
        #rotate-camera-btn {
            position: absolute;
            bottom: 0.75rem;
            right: 0.75rem;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 0.7rem;
            border-radius: 50%;
            z-index: 50;
            transition: all 0.2s ease;
        }
        #rotate-camera-btn:active {
            transform: scale(0.9) rotate(90deg);
        }

        /* Prevent scrolling when swiping on mobile */
        .no-scroll {
            overflow: hidden;
            height: 100vh;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6 overflow-y-auto">

    <header class="text-center mt-2 mb-4 w-full max-w-sm">
        <h1 class="text-2xl font-black tracking-tighter text-transparent bg-clip-text bg-gradient-to-br from-white via-zinc-400 to-zinc-600">
            KHADKA BOOTH
        </h1>
        <p class="text-zinc-600 text-[7px] font-bold tracking-[0.4em] uppercase">
            Mobile Optimized
        </p>
    </header>

    <main class="w-full max-w-sm mx-auto flex flex-col gap-6">
        
        <!-- Camera Section -->
        <div class="video-container">
            <video id="input_video" class="mirrored" playsinline muted></video>
            
            <button id="rotate-camera-btn" aria-label="Switch Camera">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
            </button>

            <div id="flash-overlay" class="absolute inset-0 z-20 pointer-events-none"></div>
            <div id="countdown" class="absolute inset-0 flex items-center justify-center text-6xl font-black text-white z-30 hidden countdown-text">3</div>
            
            <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950 z-40 transition-opacity duration-500">
                <div class="w-8 h-8 border-2 border-zinc-800 border-t-white rounded-full animate-spin mb-3"></div>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex flex-col items-center gap-4">
            <button id="start-session-btn" class="w-full max-w-[260px] py-4 bg-white text-black font-black rounded-xl hover:bg-zinc-200 active:scale-95 transition-all uppercase tracking-[0.2em] shadow-xl text-[10px]">
                Start Session
            </button>

            <div id="session-status" class="hidden items-center gap-3 px-5 py-2.5 bg-zinc-900/50 backdrop-blur-xl border border-zinc-800 rounded-full">
                <div class="flex gap-1.5">
                    <span class="dot w-1.5 h-1.5 rounded-full bg-zinc-800"></span>
                    <span class="dot w-1.5 h-1.5 rounded-full bg-zinc-800"></span>
                    <span class="dot w-1.5 h-1.5 rounded-full bg-zinc-800"></span>
                    <span class="dot w-1.5 h-1.5 rounded-full bg-zinc-800"></span>
                </div>
                <span class="text-[8px] font-black text-white uppercase tracking-widest">
                    <span id="pose-count">1</span> / 4
                </span>
            </div>
        </div>

        <!-- Result Section -->
        <aside id="preview-section" class="hidden animate-in fade-in slide-in-from-bottom-4 duration-500 pb-10">
            <div class="flex flex-col items-center">
                <div id="strip-container" class="strip-preview-vertical">
                    <!-- Images will be injected here -->
                </div>
                
                <button id="download-btn" class="mt-6 w-full max-w-[200px] py-3.5 bg-zinc-100 hover:bg-white text-black font-black rounded-xl transition-all uppercase tracking-widest text-[9px] shadow-lg">
                    Download Strip
                </button>
            </div>
        </aside>
    </main>

    <footer class="mt-auto py-6 text-zinc-800 text-[7px] font-bold tracking-[0.4em] uppercase text-center">
        &copy; KHADKA SHARAD
    </footer>

    <canvas id="final_strip_canvas" style="display:none;"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const loadingOverlay = document.getElementById('loading');
        const countdownEl = document.getElementById('countdown');
        const sessionStatus = document.getElementById('session-status');
        const poseCountEl = document.getElementById('pose-count');
        const stripContainer = document.getElementById('strip-container');
        const previewSection = document.getElementById('preview-section');
        const flashOverlay = document.getElementById('flash-overlay');
        const startBtn = document.getElementById('start-session-btn');
        const rotateBtn = document.getElementById('rotate-camera-btn');

        let isSessionActive = false;
        let capturedImages = [];
        let useFrontCamera = true;
        let cameraInstance = null;

        async function startCamera() {
            if (cameraInstance) {
                await cameraInstance.stop();
            }
            
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';

            const facingMode = useFrontCamera ? "user" : "environment";
            videoElement.className = useFrontCamera ? "mirrored" : "";

            cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (loadingOverlay.style.opacity !== '0') {
                        loadingOverlay.style.opacity = '0';
                        setTimeout(() => loadingOverlay.style.display = 'none', 500);
                    }
                },
                width: 1280,
                height: 720,
                facingMode: facingMode
            });
            
            try {
                await cameraInstance.start();
            } catch (err) {
                console.error("Camera failed:", err);
            }
        }

        // Toggle camera even during session
        rotateBtn.onclick = async (e) => {
            e.stopPropagation();
            useFrontCamera = !useFrontCamera;
            await startCamera();
        };

        const takePhoto = (index) => {
            flashOverlay.classList.remove('flash-active');
            void flashOverlay.offsetWidth;
            flashOverlay.classList.add('flash-active');
            
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = 1200;
            tempCanvas.height = 750;
            const ctx = tempCanvas.getContext('2d');
            
            if (useFrontCamera) {
                ctx.translate(tempCanvas.width, 0);
                ctx.scale(-1, 1);
            }

            const videoRatio = videoElement.videoWidth / videoElement.videoHeight;
            const targetRatio = tempCanvas.width / tempCanvas.height;
            
            let drawW, drawH, drawX, drawY;
            if (videoRatio > targetRatio) {
                drawH = videoElement.videoHeight;
                drawW = videoElement.videoHeight * targetRatio;
                drawX = (videoElement.videoWidth - drawW) / 2;
                drawY = 0;
            } else {
                drawW = videoElement.videoWidth;
                drawH = videoElement.videoWidth / targetRatio;
                drawX = 0;
                drawY = (videoElement.videoHeight - drawH) / 2;
            }

            ctx.drawImage(videoElement, drawX, drawY, drawW, drawH, 0, 0, tempCanvas.width, tempCanvas.height);
            
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.9);
            capturedImages.push(dataUrl);

            const img = document.createElement('img');
            img.src = dataUrl;
            img.className = "rounded-sm";
            stripContainer.appendChild(img);
            
            if(index === 4) {
                const footer = document.createElement('div');
                footer.className = 'strip-footer-text';
                footer.innerText = 'KHADKA BOOTH';
                stripContainer.appendChild(footer);
            }
            
            const dots = document.querySelectorAll('.dot');
            dots[index-1].classList.replace('bg-zinc-800', 'bg-zinc-200');
        };

        const startPhotoSession = async () => {
            if (isSessionActive) return;
            isSessionActive = true;
            capturedImages = [];
            stripContainer.innerHTML = '';
            previewSection.classList.add('hidden');
            
            document.querySelectorAll('.dot').forEach(d => d.className = "dot w-1.5 h-1.5 rounded-full bg-zinc-800");
            startBtn.classList.add('opacity-0', 'pointer-events-none');
            sessionStatus.classList.remove('hidden');
            sessionStatus.classList.add('flex');
            
            for (let i = 1; i <= 4; i++) {
                poseCountEl.innerText = i;
                for (let c = 3; c > 0; c--) {
                    countdownEl.innerText = c;
                    countdownEl.classList.remove('hidden');
                    await new Promise(r => setTimeout(r, 1000));
                }
                countdownEl.classList.add('hidden');
                takePhoto(i);
                await new Promise(r => setTimeout(r, 1000));
            }

            sessionStatus.classList.add('hidden');
            previewSection.classList.remove('hidden');
            startBtn.classList.remove('opacity-0', 'pointer-events-none');
            startBtn.innerText = "New Session";
            isSessionActive = false;
            
            // Smooth scroll to the result on mobile
            setTimeout(() => {
                previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        };

        const generateFinalStrip = () => {
            return new Promise((resolve) => {
                const finalCanvas = document.getElementById('final_strip_canvas');
                const fCtx = finalCanvas.getContext('2d');
                
                const imgW = 1000;
                const imgH = 625; 
                const gapY = 25;
                const margin = 70;
                const brandingH = 180;
                
                finalCanvas.width = imgW + (margin * 2);
                finalCanvas.height = (imgH * 4) + (gapY * 3) + (margin * 2) + brandingH;
                
                fCtx.fillStyle = 'white';
                fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                
                let loaded = 0;
                capturedImages.forEach((src, idx) => {
                    const img = new Image();
                    img.onload = () => {
                        const y = margin + (idx * (imgH + gapY));
                        fCtx.drawImage(img, margin, y, imgW, imgH);
                        
                        loaded++;
                        if (loaded === 4) {
                            fCtx.fillStyle = '#000';
                            fCtx.textAlign = 'center';
                            fCtx.font = '900 48px sans-serif';
                            fCtx.letterSpacing = "15px";
                            fCtx.fillText('KHADKA BOOTH', finalCanvas.width / 2, finalCanvas.height - 90);
                            
                            fCtx.font = 'italic 22px Georgia, serif';
                            fCtx.letterSpacing = "0px";
                            fCtx.fillStyle = '#888';
                            fCtx.fillText('Studio Quality • 2026', finalCanvas.width / 2, finalCanvas.height - 50);
                            
                            resolve(finalCanvas.toDataURL('image/jpeg', 0.95));
                        }
                    };
                    img.src = src;
                });
            });
        };

        startBtn.onclick = startPhotoSession;
        startCamera();

        document.getElementById('download-btn').onclick = async () => {
            const btn = document.getElementById('download-btn');
            btn.innerText = "Processing...";
            const dataUrl = await generateFinalStrip();
            const link = document.createElement('a');
            link.download = `khadka-booth-${Date.now()}.jpg`;
            link.href = dataUrl;
            link.click();
            btn.innerText = "Download Strip";
        };
    </script>
</body>
</html>
