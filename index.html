<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KHADKA PHOTO BOOTH</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    
</head>
<body class="min-h-screen flex flex-col items-center p-4">

    <header class="text-center mt-6 mb-8 w-full">
        <h1 class="text-4xl font-black tracking-tighter text-zinc-900 mb-1">
            KHADKA BOOTH
        </h1>
        <p class="text-zinc-500 text-[10px] font-bold tracking-[0.3em] uppercase mb-4">
            Strike 4 different poses
        </p>
    
    </header>

    <main class="w-full flex flex-col items-center gap-8">
        
        <!-- Camera Section -->
        <div class="video-container">
            <video id="input_video" class="mirrored" playsinline muted></video>
            
            <button id="rotate-camera-btn" aria-label="Switch Camera">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
            </button>

            <div id="flash-overlay" class="absolute inset-0 z-20 pointer-events-none"></div>
            <div id="countdown" class="absolute inset-0 flex items-center justify-center font-black text-white z-30 hidden countdown-text">3</div>
            
            <div id="loading" class="absolute inset-0 flex flex-col items-center justify-center bg-zinc-950 z-40 transition-opacity duration-500">
                <div class="w-12 h-12 border-4 border-zinc-800 border-t-white rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- Session Progress -->
        <div id="session-status" class="hidden items-center gap-4 px-8 py-4 bg-white/50 backdrop-blur border border-zinc-200 rounded-3xl shadow-xl">
            <div class="flex gap-3">
                <span class="dot w-3 h-3 rounded-full bg-zinc-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-zinc-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-zinc-300"></span>
                <span class="dot w-3 h-3 rounded-full bg-zinc-300"></span>
            </div>
            <span class="text-xs font-black text-zinc-900 uppercase tracking-widest">
                Shot <span id="pose-count">1</span> / 4
            </span>
        </div>

        <!-- Primary Action -->
        <button id="start-session-btn" class="btn-primary active:scale-95">
            Start Session
        </button>

        <!-- Result Section -->
        <aside id="preview-section" class="hidden animate-in fade-in slide-in-from-bottom-10 duration-700 w-full pb-20">
            <div class="flex flex-col items-center">
                <div id="strip-container" class="strip-preview-vertical">
                    <!-- Square Images will be injected here -->
                </div>
                
                <button id="download-btn" class="btn-primary mt-4 active:scale-95">
                    Save Photo Strip
                </button>
            </div>
        </aside>
    </main>

    <footer class="mt-auto py-10 text-zinc-900 text-[10px] font-bold tracking-[0.5em] uppercase text-center">
        <a href="https://github.com" target="_blank" class="footer-link">
            KHADKA SHARAD
        </a> 
        &copy; 2026
    </footer>

    <canvas id="final_strip_canvas" style="display:none;"></canvas>

    <script>
        const videoElement = document.getElementById('input_video');
        const loadingOverlay = document.getElementById('loading');
        const countdownEl = document.getElementById('countdown');
        const sessionStatus = document.getElementById('session-status');
        const poseCountEl = document.getElementById('pose-count');
        const stripContainer = document.getElementById('strip-container');
        const previewSection = document.getElementById('preview-section');
        const flashOverlay = document.getElementById('flash-overlay');
        const startBtn = document.getElementById('start-session-btn');
        const rotateBtn = document.getElementById('rotate-camera-btn');

        let isSessionActive = false;
        let capturedImages = [];
        let useFrontCamera = true;
        let cameraInstance = null;

        async function startCamera() {
            if (cameraInstance) await cameraInstance.stop();
            loadingOverlay.style.display = 'flex';
            loadingOverlay.style.opacity = '1';

            const facingMode = useFrontCamera ? "user" : "environment";
            videoElement.className = useFrontCamera ? "mirrored" : "";

            cameraInstance = new Camera(videoElement, {
                onFrame: async () => {
                    if (loadingOverlay.style.opacity !== '0') {
                        loadingOverlay.style.opacity = '0';
                        setTimeout(() => loadingOverlay.style.display = 'none', 500);
                    }
                },
                width: 1080,
                height: 1080,
                facingMode: facingMode
            });
            await cameraInstance.start();
        }

        rotateBtn.onclick = async () => {
            useFrontCamera = !useFrontCamera;
            await startCamera();
        };

        const takePhoto = (index) => {
            flashOverlay.classList.remove('flash-active');
            void flashOverlay.offsetWidth;
            flashOverlay.classList.add('flash-active');
            
            const tempCanvas = document.createElement('canvas');
            const size = 1080;
            tempCanvas.width = size;
            tempCanvas.height = size;
            const ctx = tempCanvas.getContext('2d');
            
            if (useFrontCamera) {
                ctx.translate(size, 0);
                ctx.scale(-1, 1);
            }

            const vW = videoElement.videoWidth;
            const vH = videoElement.videoHeight;
            const minDim = Math.min(vW, vH);
            const sx = (vW - minDim) / 2;
            const sy = (vH - minDim) / 2;

            ctx.drawImage(videoElement, sx, sy, minDim, minDim, 0, 0, size, size);
            
            const dataUrl = tempCanvas.toDataURL('image/jpeg', 0.95);
            capturedImages.push(dataUrl);

            const img = document.createElement('img');
            img.src = dataUrl;
            stripContainer.appendChild(img);
            
            if(index === 4) {
                const footer = document.createElement('div');
                footer.className = 'strip-footer-text';
                footer.innerText = 'KHADKA BOOTH';
                stripContainer.appendChild(footer);
            }
            
            const dots = document.querySelectorAll('.dot');
            dots[index-1].classList.replace('bg-zinc-300', 'bg-zinc-900');
        };

        const startPhotoSession = async () => {
            if (isSessionActive) return;
            isSessionActive = true;
            capturedImages = [];
            stripContainer.innerHTML = '';
            previewSection.classList.add('hidden');
            
            document.querySelectorAll('.dot').forEach(d => d.className = "dot w-3 h-3 rounded-full bg-zinc-300");
            startBtn.classList.add('hidden');
            sessionStatus.classList.remove('hidden');
            sessionStatus.classList.add('flex');
            
            for (let i = 1; i <= 4; i++) {
                poseCountEl.innerText = i;
                for (let c = 3; c > 0; c--) {
                    countdownEl.innerText = c;
                    countdownEl.classList.remove('hidden');
                    await new Promise(r => setTimeout(r, 1000));
                }
                countdownEl.classList.add('hidden');
                takePhoto(i);
                await new Promise(r => setTimeout(r, 800));
            }

            sessionStatus.classList.add('hidden');
            previewSection.classList.remove('hidden');
            startBtn.classList.remove('hidden');
            startBtn.innerText = "Take Another Strip";
            isSessionActive = false;
            
            setTimeout(() => {
                previewSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        };

        const generateFinalStrip = () => {
            return new Promise((resolve) => {
                const finalCanvas = document.getElementById('final_strip_canvas');
                const fCtx = finalCanvas.getContext('2d');
                
                const imgSize = 1000;
                const gap = 30;
                const margin = 80;
                const brandingH = 200;
                
                finalCanvas.width = imgSize + (margin * 2);
                finalCanvas.height = (imgSize * 4) + (gap * 3) + (margin * 2) + brandingH;
                
                fCtx.fillStyle = 'white';
                fCtx.fillRect(0, 0, finalCanvas.width, finalCanvas.height);
                
                let loaded = 0;
                capturedImages.forEach((src, idx) => {
                    const img = new Image();
                    img.onload = () => {
                        const y = margin + (idx * (imgSize + gap));
                        fCtx.drawImage(img, margin, y, imgSize, imgSize);
                        
                        loaded++;
                        if (loaded === 4) {
                            fCtx.fillStyle = '#000';
                            fCtx.textAlign = 'center';
                            fCtx.font = '900 60px sans-serif';
                            fCtx.letterSpacing = "15px";
                            fCtx.fillText('KHADKA BOOTH', finalCanvas.width / 2, finalCanvas.height - 100);
                            
                            fCtx.font = 'italic 28px Georgia, serif';
                            fCtx.letterSpacing = "0px";
                            fCtx.fillStyle = '#666';
                            fCtx.fillText('Professional Quality • 2026', finalCanvas.width / 2, finalCanvas.height - 55);
                            
                            resolve(finalCanvas.toDataURL('image/jpeg', 0.98));
                        }
                    };
                    img.src = src;
                });
            });
        };

        startBtn.onclick = startPhotoSession;
        startCamera();

        document.getElementById('download-btn').onclick = async () => {
            const btn = document.getElementById('download-btn');
            btn.innerText = "Preparing High-Res...";
            const dataUrl = await generateFinalStrip();
            const link = document.createElement('a');
            link.download = `khadka-square-strip-${Date.now()}.jpg`;
            link.href = dataUrl;
            link.click();
            btn.innerText = "Save Photo Strip";
        };
    </script>
</body>
</html>
